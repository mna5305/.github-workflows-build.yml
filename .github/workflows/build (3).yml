name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          mkdir -p "$(dirname '.gitignore')"
          echo 'LmdyYWRsZS8KYnVpbGQvCmxvY2FsLnByb3BlcnRpZXMKLmlkZWEvCiouaW1sCg==' | base64 -d > '.gitignore'
          mkdir -p "$(dirname 'FEATURES.md')"
          echo '' | base64 -d > 'FEATURES.md'
          mkdir -p "$(dirname 'README.md')"
          echo '' | base64 -d > 'README.md'
          mkdir -p "$(dirname 'build.gradle.kts')"
          echo 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjUuMiIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMS45LjI0IiBhcHBseSBmYWxzZQp9Cg==' | base64 -d > 'build.gradle.kts'
          mkdir -p "$(dirname 'gradle.properties')"
          echo 'YW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCm9yZy5ncmFkbGUuanZtYXJncz0tWG14MmcK' | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'settings.gradle.kts')"
          echo 'cGx1Z2luTWFuYWdlbWVudCB7IHJlcG9zaXRvcmllcyB7IGdvb2dsZSgpOyBtYXZlbkNlbnRyYWwoKTsgZ3JhZGxlUGx1Z2luUG9ydGFsKCkgfSB9CmRlcGVuZGVuY3lSZXNvbHV0aW9uTWFuYWdlbWVudCB7IHJlcG9zaXRvcmllcyB7IGdvb2dsZSgpOyBtYXZlbkNlbnRyYWwoKSB9IH0Kcm9vdFByb2plY3QubmFtZSA9ICJTb2JpYU5hZWVtR2FsbGVyeSIKaW5jbHVkZSgiOmFwcCIpCg==' | base64 -d > 'settings.gradle.kts'
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          echo '' | base64 -d > 'app/build.gradle.kts'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/java/com/sobianaeem/gallery/MainActivity.kt')"
          echo '' | base64 -d > 'app/src/main/java/com/sobianaeem/gallery/MainActivity.kt'
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          echo 'PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5Tb2JpYSBOYWVlbSBHYWxsZXJ5PC9zdHJpbmc+PC9yZXNvdXJjZXM+Cg==' | base64 -d > 'app/src/main/res/values/strings.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          echo '' | base64 -d > 'app/src/main/res/values/themes.xml'
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi/ic_launcher.xml')"
          echo '' | base64 -d > 'app/src/main/res/mipmap-anydpi/ic_launcher.xml'
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_bg.xml')"
          echo '' | base64 -d > 'app/src/main/res/drawable/ic_bg.xml'
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_fg.xml')"
          echo '' | base64 -d > 'app/src/main/res/drawable/ic_fg.xml'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SobiaNaeemGallery-debug-apk
          path: app/build/outputs/apk/debug/*.apk
